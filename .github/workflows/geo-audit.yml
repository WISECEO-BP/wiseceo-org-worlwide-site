name: GEO & AI-SEO Compliance Audit

on:
  # After each successful Vercel production deploy, so we audit the site that just went live
  # (a plain push to main would race the deploy and audit the previous version).
  deployment_status:
  schedule:
    # Weekly on Mondays at 8:00 AM UTC to catch external drift
    - cron: '0 8 * * 1'
  workflow_dispatch:
  # The offline repo audit (scripts/audit_geo.py) also runs on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-audit:
    # Checks the files in the PR: wiki build, canonicals, OG, JSON-LD, mini-answers,
    # llms.txt, sitemap, robots.txt and entity consistency. Fails only on errors.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repo GEO audit
        run: python3 scripts/audit_geo.py

  audit:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GEO Optimizer CLI
        # Pinned: this package releases several times a week; bump deliberately.
        run: |
          python -m pip install --upgrade pip
          pip install geo-optimizer-skill==4.23.0

      - name: Run AI-SEO & GEO Audit
        run: |
          geo audit --url https://www.wiseceo.org --threshold 80 --format github --no-plugins
