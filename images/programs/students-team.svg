<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A mentor helping two students at a laptop">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0052cc"/></linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg2)"/>

  <!-- mentor (standing, with lanyard) -->
  <rect x="196" y="92" width="74" height="120" rx="30" fill="#0f172a"/>
  <path d="M220 94 l13 34 l13 -34" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <rect x="226" y="126" width="14" height="18" rx="3" fill="#f59e0b"/>
  <circle cx="233" cy="68" r="22" fill="#6b4226"/>
  <path d="M211 66 a22 22 0 0 1 44 0 l2 22 q-4 -16 -8 -20 q-12 -8 -28 0 q-4 4 -8 20z" fill="#1a0f05"/>
  <circle cx="226" cy="70" r="2.4" fill="#1a0f05"/><circle cx="240" cy="70" r="2.4" fill="#1a0f05"/>
  <path d="M227 79 q6 5 12 0" stroke="#1a0f05" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M206 120 q-22 10 -40 34" stroke="#0f172a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="166" cy="154" r="7" fill="#6b4226"/>

  <!-- student 1 (seated, ponytail) -->
  <rect x="22" y="122" width="62" height="80" rx="26" fill="#f472b6"/>
  <circle cx="72" cy="88" r="12" fill="#3b2314"/>
  <circle cx="53" cy="100" r="19" fill="#f1c27d"/>
  <path d="M34 98 a19 19 0 0 1 38 0 q-8 -9 -19 -9 q-11 0 -19 9z" fill="#3b2314"/>
  <circle cx="47" cy="102" r="2.2" fill="#3b2314"/><circle cx="59" cy="102" r="2.2" fill="#3b2314"/>
  <path d="M48 110 q5 4 10 0" stroke="#3b2314" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- student 2 (seated, glasses) -->
  <rect x="96" y="126" width="62" height="76" rx="26" fill="#22d3ee"/>
  <circle cx="127" cy="104" r="19" fill="#c68642"/>
  <path d="M108 100 a19 19 0 0 1 38 0 q-4 -12 -19 -12 q-15 0 -19 12z" fill="#111"/>
  <g fill="none" stroke="#111" stroke-width="2"><circle cx="120" cy="106" r="5"/><circle cx="134" cy="106" r="5"/><path d="M125 106h4"/></g>
  <path d="M122 115 q5 4 10 0" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- table and open laptop with code on screen -->
  <rect x="0" y="168" width="300" height="32" fill="#0b1530"/>
  <rect x="62" y="122" width="96" height="50" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <g stroke-width="4" stroke-linecap="round">
    <path d="M74 136h30" stroke="#22d3ee"/><path d="M82 146h44" stroke="#a78bfa"/>
    <path d="M82 156h26" stroke="#4ade80"/><path d="M74 164h36" stroke="#fbbf24"/>
  </g>
  <rect x="52" y="170" width="116" height="6" rx="3" fill="#94a3b8"/>
</svg>
