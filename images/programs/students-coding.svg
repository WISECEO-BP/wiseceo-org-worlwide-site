<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 600 230" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Three students coding on laptops">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93c5fd" opacity=".25"/></pattern>
  </defs>
  <rect y="-10" width="600" height="250" fill="url(#bg)"/>
  <rect y="-10" width="600" height="250" fill="url(#dots)"/>

  <!-- code bubbles -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="700" font-size="15" text-anchor="middle">
    <rect x="112" y="18" width="76" height="30" rx="10" fill="#0f172a" opacity=".85"/><text x="150" y="38" fill="#22d3ee">&lt;/&gt;</text>
    <rect x="262" y="12" width="76" height="30" rx="10" fill="#0f172a" opacity=".85"/><text x="300" y="32" fill="#fbbf24">{ AI }</text>
    <rect x="412" y="18" width="76" height="30" rx="10" fill="#0f172a" opacity=".85"/><text x="450" y="38" fill="#4ade80">01</text>
  </g>

  <!-- student 1: short hair -->
  <rect x="110" y="120" width="80" height="90" rx="32" fill="#f59e0b"/>
  <circle cx="150" cy="94" r="24" fill="#8d5524"/>
  <path d="M126 92 a24 24 0 0 1 48 0 q-6 -12 -24 -12 q-18 0 -24 12z" fill="#1f1300"/>
  <circle cx="141" cy="96" r="2.6" fill="#1f1300"/><circle cx="159" cy="96" r="2.6" fill="#1f1300"/>
  <path d="M143 106 q7 5 14 0" stroke="#1f1300" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- student 2: hijab -->
  <rect x="260" y="118" width="80" height="92" rx="32" fill="#a78bfa"/>
  <path d="M272 120 q-6 -52 28 -54 q34 2 28 54 q-28 14 -56 0z" fill="#0e7490"/>
  <ellipse cx="300" cy="96" rx="17" ry="20" fill="#c68642"/>
  <circle cx="293" cy="96" r="2.6" fill="#2b1a0e"/><circle cx="307" cy="96" r="2.6" fill="#2b1a0e"/>
  <path d="M294 106 q6 5 12 0" stroke="#2b1a0e" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- student 3: afro puff -->
  <rect x="410" y="120" width="80" height="90" rx="32" fill="#22c55e"/>
  <circle cx="450" cy="62" r="16" fill="#1a0f05"/>
  <circle cx="450" cy="90" r="30" fill="#1a0f05"/>
  <circle cx="450" cy="98" r="22" fill="#5c3a1e"/>
  <circle cx="442" cy="98" r="2.6" fill="#120a03"/><circle cx="458" cy="98" r="2.6" fill="#120a03"/>
  <path d="M444 108 q6 5 12 0" stroke="#120a03" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- desk and laptops (lids face the viewer) -->
  <rect x="0" y="188" width="600" height="52" fill="#0b1530"/>
  <g>
    <rect x="102" y="146" width="96" height="48" rx="7" fill="#cbd5e1"/><circle cx="150" cy="170" r="7" fill="#7c5cff"/>
    <rect x="252" y="146" width="96" height="48" rx="7" fill="#cbd5e1"/><circle cx="300" cy="170" r="7" fill="#22d3ee"/>
    <rect x="402" y="146" width="96" height="48" rx="7" fill="#cbd5e1"/><circle cx="450" cy="170" r="7" fill="#f472b6"/>
  </g>
  <rect x="0" y="192" width="600" height="4" fill="#1e293b"/>
</svg>
